<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - LAOLAK</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="media.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="container header-content">
        <div class="logo">LAOLAK</div>

        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="index.html#services">Services</a>
          <a href="contact.html">Contact</a>
        </nav>

        <a href="contact.html" class="btn-primary">Get Started</a>
      </div>
    </header>

    <!-- HERO -->
    <section class="contact-hero section">
      <div class="container">
        <h1>Let’s Fix, Build or Deliver 🚀</h1>
        <p>Tell us what you need and we’ll respond fast.</p>
      </div>
    </section>

    <!-- CONTACT SECTION -->
    <section class="contact section">
      <div class="container contact-grid">
        <!-- LEFT SIDE -->
        <div class="contact-info fade-up">
          <h3>Contact Information</h3>
          <p>📞 +234 906 067 6932</p>
          <p>📧 akinolalawal1804@gmail.com</p>
          <p>📍 Ibadan, Nigeria</p>

          <!-- <div
            class="contact-image"
            style="background-image: url(images/repair.png)"
          ></div> -->
        </div>

        <!-- RIGHT SIDE (FORM) -->
        <div class="contact-form-box fade-up">
          <h3>Send a Request</h3>

          <form id="whatsappForm">
            <input type="text" id="name" placeholder="Your Name" required />

            <input type="tel" id="phone" placeholder="Phone Number" required />

            <select id="service" required>
              <option value="">Select Service</option>
              <option>Phone Repair</option>
              <option>Gadget Purchase</option>
              <option>Web Development</option>
            </select>

            <textarea
              id="message"
              placeholder="Describe your request"
              required
            ></textarea>

            <button type="submit" class="btn-primary">Send via WhatsApp</button>
          </form>
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
